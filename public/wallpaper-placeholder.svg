<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder wallpaper: soft macOS-style colour field in the site palette
       (oat, ink, burgundy). Replace via desktopConfig.wallpaper. -->
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="140" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0.05 0" />
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#f3ecdf" />
  <g filter="url(#blur)">
    <ellipse cx="1250" cy="180" rx="520" ry="360" fill="#b4c3e2" />
    <ellipse cx="1450" cy="820" rx="480" ry="320" fill="#93a6cf" opacity="0.8" />
    <ellipse cx="280" cy="900" rx="560" ry="300" fill="#ecd5d3" />
    <ellipse cx="760" cy="560" rx="360" ry="240" fill="#ede3d1" />
    <ellipse cx="180" cy="120" rx="380" ry="260" fill="#faf6ee" />
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" />
</svg>
